<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felicidades - Pase Royale Épico!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Clash Royale Supercell style -->
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Vibrant Royale Arena Blue & Electric Gold Background */
            background: radial-gradient(circle at center, #1e3a8a 0%, #0c1c44 55%, #050b18 100%);
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .clash-font {
            font-family: 'Luckiest Guy', cursive;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #1e1b4b, -2px -2px 0px #1e1b4b, 2px -2px 0px #1e1b4b, -2px 2px 0px #1e1b4b, 4px 5px 20px rgba(0,0,0,0.9);
        }
        /* Extra Vibrant Royal Card Texture */
        .royal-card {
            background: linear-gradient(145deg, #1d4ed8 0%, #0f172a 100%);
            border: 6px solid #fde047;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), 0 0 50px rgba(253, 224, 71, 0.5), inset 0 0 40px rgba(59, 130, 246, 0.5);
            border-radius: 36px;
            position: relative;
        }
        .royal-card::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            bottom: 6px;
            border: 2px dashed rgba(253, 224, 71, 0.6);
            border-radius: 28px;
            pointer-events: none;
        }
        .gem-box {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(15, 23, 42, 0.95) 80%);
            border: 3px solid #38bdf8;
            box-shadow: inset 0 0 30px rgba(56, 189, 248, 0.5), 0 0 25px rgba(56, 189, 248, 0.4);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1.5deg); }
        }
        .floating {
            animation: floatSlow 3s ease-in-out infinite;
        }
        @keyframes crownGlow {
            0%, 100% { filter: drop-shadow(0 0 15px #fde047) brightness(1); }
            50% { filter: drop-shadow(0 0 35px #fde047) brightness(1.3); }
        }
        .crown-animated {
            animation: crownGlow 2s ease-in-out infinite;
        }
        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(253, 224, 71, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative selection:bg-yellow-400 selection:text-black">

    <!-- Confetti & Serpentina Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Background glowing ambient lights with ultra-vibrant colors -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[550px] bg-blue-500/20 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-[400px] h-[400px] bg-yellow-400/15 rounded-full blur-[130px] pointer-events-none"></div>

    <!-- Top Header -->
    <header class="w-full glass-header py-3 px-6 flex justify-between items-center z-10 fixed top-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-yellow-400 to-amber-500 rounded-xl flex items-center justify-center border-2 border-white shadow-lg shadow-yellow-500/40">
                <i class="fa-solid fa-crown text-blue-950 text-lg"></i>
            </div>
            <span class="clash-font text-yellow-400 text-lg md:text-xl tracking-wider">CLASH ROYALE</span>
        </div>
        <div class="flex items-center space-x-2 bg-blue-950/90 px-4 py-1.5 rounded-full border border-cyan-400 shadow-inner">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-cyan-300 clash-font text-xs tracking-widest">EVENTO VIP</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-lg z-10 px-4 py-16 flex flex-col items-center my-auto">
        
        <!-- Birthday Banner Pill -->
        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-yellow-400 text-white clash-font text-base md:text-xl px-8 py-3 rounded-full shadow-2xl mb-6 transform -rotate-1 border-2 border-yellow-300 floating flex items-center space-x-3">
            <span>🎉</span>
            <span>¡FELIZ CUMPLEAÑOS!</span>
            <span>🎉</span>
        </div>

        <!-- Royal Card Box -->
        <div class="royal-card p-6 md:p-8 w-full text-center relative overflow-hidden">
            
            <!-- Crown Header Icon -->
            <div class="flex justify-center mb-3">
                <div class="text-yellow-400 text-5xl md:text-6xl crown-animated">
                    👑
                </div>
            </div>

            <!-- Main Title -->
            <h1 class="clash-font text-3xl md:text-4xl text-yellow-400 mb-2 leading-tight drop-shadow-md">
                ¡HAS GANADO UN PASE ÉPICO!
            </h1>
            <p class="text-blue-100 text-sm md:text-base font-bold mb-6">
                Recompensa exclusiva de la Arena Legendaria otorgada en tu día especial.
            </p>

            <!-- Reward Display Box (Removed Premio Máximo badge as requested) -->
            <div class="gem-box rounded-2xl p-6 mb-4 relative mt-2">
                <div class="flex justify-center items-center space-x-4 my-2">
                    <div class="relative group">
                        <!-- Gem / Pass Graphic Circle -->
                        <div class="w-20 h-20 md:w-24 md:h-24 bg-gradient-to-tr from-cyan-400 to-blue-600 rounded-2xl flex items-center justify-center border-4 border-yellow-300 shadow-2xl transform transition hover:scale-105 duration-300">
                            <i class="fa-solid fa-gem text-4xl md:text-5xl text-yellow-200 drop-shadow-[0_0_15px_rgba(253,224,71,1)]"></i>
                        </div>
                        <div class="absolute -bottom-2 -right-2 bg-blue-600 text-white font-black text-xs px-2.5 py-1 rounded-lg border-2 border-yellow-300 clash-font shadow">
                            VIP
                        </div>
                    </div>
                </div>

                <div class="clash-font text-4xl md:text-5xl text-cyan-300 mt-4 mb-1 tracking-wide">
                    50,000
                </div>
                <div class="clash-font text-lg md:text-xl text-yellow-300 tracking-wider">
                    PASE ROYALE
                </div>
                <p class="text-xs text-blue-100 mt-3 font-semibold bg-blue-900/80 p-3 rounded-xl border border-cyan-400/50">
                    ✨ ¡Desbloqueado con éxito para celebrar tu día al máximo! Disfruta de tu gran premio en Clash Royale.
                </p>
            </div>

        </div>

    </main>

    <!-- Interactive Script with Confetti & Serpentina -->
    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        // Colores temáticos Clash Royale: Azules clásicos, Dorados, Cian mágico y blanco
        const colors = ['#facc15', '#38bdf8', '#60a5fa', '#1d4ed8', '#ffffff', '#fbbf24', '#93c5fd'];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 4 - 2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 12 - 6;
                this.shape = Math.random() > 0.4 ? 'ribbon' : (Math.random() > 0.5 ? 'rect' : 'circle');
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
                this.speedY += 0.04; // gravedad suave
                if (this.y > canvas.height) {
                    this.y = -20;
                    this.x = Math.random() * canvas.width;
                    this.speedY = Math.random() * 3 + 2;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                
                if (this.shape === 'ribbon') {
                    // Serpentina alargada
                    ctx.fillRect(-this.size / 3, -this.size, this.size * 0.6, this.size * 2);
                } else if (this.shape === 'rect') {
                    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.6);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function initConfetti() {
            particles = [];
            for (let i = 0; i < 110; i++) {
                particles.push(new Particle());
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateConfetti);
        }

        initConfetti();
        animateConfetti();
    </script>
</body>
</html>
